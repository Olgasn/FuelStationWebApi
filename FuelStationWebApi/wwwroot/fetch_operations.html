<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Операции</title>
    <!-- логотип как значок вкладки браузера -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
    <link href="lib/bootstrap/css/bootstrap.css" rel="stylesheet" />
    <script src="lib/jquery/jquery.js"></script>
    <link href="lib/jquery-ui/dist/themes/base/jquery-ui.min.css" rel="stylesheet" />
    <script src="lib/jquery-ui/dist/jquery-ui.js"></script>
    <script src="lib/jquery-ui/ui/i18n/datepicker-ru.js"></script>
    <script>
        $(function () {
            //ввод даты с использованием специального окна
            $("#date").datepicker({ dateFormat: "yy-mm-dd" });
        });
    </script>

</head>
<body onload="">
    <div class="container">
        <!-- логотип и название -->
        <header class="d-flex align-items-center gap-3 py-3 mb-3 border-bottom">
            <img src="img/logo.svg" alt="Логотип топливной базы" width="48" height="48" />
            <span class="fs-4 fw-semibold">Топливная база</span>
            <!-- переход на страницу входа, где выдается токен доступа -->
            <a href="index.html" class="btn btn-sm btn-primary ms-auto">Войти</a>
        </header>
        <h2>Список операций</h2>

        <form name="operationForm">
            <table border="0">
                <tr>
                    <td>
                        <label for="operationId" id="typeCRUD" name="typeCRUD">Добавить:</label>
                        <input type="hidden" id="operationId" name="operationId" value=0 />
                        <div class="form-group">
                            <label Добавить>Топливо:</label>
                            <select id="fuelId" name="fuelId"></select>
                        </div>
                        <div class="form-group">
                            <label for="tankType">Емкость:</label>
                            <select id="tankId" name="tankId"></select>
                        </div>
                    </td>
                    <td>
                        <a id="filter" class="btn btn-sm btn-primary">Загрузить</a>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <div class="form-group">
                            <label for="inc_exp">Приход-расход:</label>
                            <input class="form-control" name="inc_exp" id="inc_exp" />
                        </div>
                        <div class="form-group">
                            <label for="date">Дата:</label>
                            <input class="form-control" name="date" id="date" />
                        </div>
                        <div class="panel-body">
                            <button id="saveBtn" type="submit" class="btn btn-sm btn-primary">Сохранить</button>
                            <a id="reset" class="btn btn-sm btn-primary">Сбросить</a>

                        </div>
                    </td>
                </tr>
            </table>
        </form>


        <table class="table table-condensed table-striped table-bordered">
            <thead><tr><th>Код</th><th>Топливо</th><th>Емкость</th><th>Приход-расход</th><th>Дата</th><th>Действие</th><th>Действие</th></tr></thead>
            <tbody id="data"></tbody>
        </table>

        <!-- панель переключения страниц -->
        <div class="d-flex align-items-center gap-3">
            <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
            <span id="pageInfo"></span>
        </div>
    </div>

    <script>

        // Постраничный вывод выполняется на стороне клиента:
        // все операции загружаются один раз, а в таблице показывается только одна страница
        const pageSize = 10;      // количество строк на одной странице
        let allOperations = [];   // все загруженные операции (с учетом фильтра)
        let currentPage = 1;      // номер текущей страницы

        // Количество страниц (не меньше одной, даже если данных нет)
        function getPageCount() {
            return Math.max(1, Math.ceil(allOperations.length / pageSize));
        }

        // Вывод в таблицу строк указанной страницы и обновление панели страниц
        function showPage(page) {
            // номер страницы не должен выходить за допустимые границы
            currentPage = Math.min(Math.max(page, 1), getPageCount());
            const rows = document.querySelector("table tbody#data");
            rows.innerHTML = "";
            // берем из общего списка только операции текущей страницы
            const start = (currentPage - 1) * pageSize;
            allOperations.slice(start, start + pageSize).forEach(operation => rows.append(row(operation)));
            showPager();
        }

        // Формирование панели страниц: « ‹ 1 2 3 4 5 › »
        function showPager() {
            const pageCount = getPageCount();
            const pager = document.getElementById("pagination");
            pager.innerHTML = "";
            pager.append(pageItem("«", 1, currentPage === 1));
            pager.append(pageItem("‹", currentPage - 1, currentPage === 1));
            // показываем не более пяти номеров страниц вокруг текущей
            const first = Math.max(1, Math.min(currentPage - 2, pageCount - 4));
            const last = Math.min(pageCount, first + 4);
            for (let page = first; page <= last; page++)
                pager.append(pageItem(page, page, false, page === currentPage));
            pager.append(pageItem("›", currentPage + 1, currentPage === pageCount));
            pager.append(pageItem("»", pageCount, currentPage === pageCount));
            document.getElementById("pageInfo").textContent =
                "Страница " + currentPage + " из " + pageCount + ", всего операций: " + allOperations.length;
        }

        // создание одной кнопки панели страниц
        function pageItem(text, page, disabled, active) {
            const li = document.createElement("li");
            li.className = "page-item" + (disabled ? " disabled" : "") + (active ? " active" : "");
            const button = document.createElement("button");
            button.type = "button";
            button.className = "page-link";
            button.disabled = disabled;
            button.append(text);
            button.addEventListener("click", () => showPage(page));
            li.append(button);
            return li;
        }

        // Получение всех операций
        async function Getoperations() {
            // отправляет запрос и получаем ответ
            const response = await fetch("/api/operations", {
                method: "GET",
                headers: {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token
                }
            });
            // если запрос прошел нормально
            if (response.ok === true) {
                // получаем данные и показываем первую страницу
                allOperations = await response.json();
                showPage(1);
            }

        }

        // Получение фильтрованных операций
        async function GetFilteredOperations() {
            var form = document.forms["operationForm"];
            var fuelID = form.elements["fuelId"].selectedIndex;
            var tankID = form.elements["tankId"].selectedIndex;

            // отправляет запрос и получаем ответ
            const response = await fetch('/api/operations/filteredoperations?TankID=' + tankID + '&FuelID=' + fuelID, {
                method: "GET",
                headers: {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token
                }
            });
            // если запрос прошел нормально
            if (response.ok === true) {
                // получаем данные и показываем первую страницу
                allOperations = await response.json();
                showPage(1);
            }
        }
        // Получение одной операции
        async function Getoperation(id) {
            // отправляет запрос и получаем ответ
            const response = await fetch('/api/operations/' + id, {
                method: "GET",
                headers: {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token
                }
            });
            // если запрос прошел нормально
            if (response.ok === true) {
                // получаем данные
                const operation = await response.json();
                var form = document.forms["operationForm"];
                form.elements["operationId"].value = operation.operationID;
                form.elements["fuelId"].selectedIndex = operation.fuelID;
                form.elements["tankId"].selectedIndex = operation.tankID;
                form.elements["inc_exp"].value = operation.inc_Exp;
                form.elements["date"].value = operation.date.substring(0, 10);
            }
        }
        // Добавление операции
        async function Createoperation(fuelId, tankId, inc_Exp, date) {
            const response = await fetch("api/operations", {
                method: "POST",
                headers: {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    fuelId: fuelId,
                    tankId: tankId,
                    inc_Exp: parseFloat(inc_Exp),
                    date: date
                })
            });
            if (response.ok === true) {
                const operation = await response.json();
                reset();
                var form = document.forms["operationForm"];
                operation.tankType = form.elements["tankId"].options[tankId].text;
                operation.fuelType = form.elements["fuelId"].options[fuelId].text;
                // новая операция добавляется в конец списка, переходим на последнюю страницу
                allOperations.push(operation);
                showPage(getPageCount());
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }
        // Изменение операции
        async function Editoperation(operationID, fuelId, tankId, inc_Exp, date) {
            const response = await fetch("api/operations", {
                method: "PUT",
                headers: {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    operationID: parseInt(operationID),
                    fuelId: fuelId,
                    tankId: tankId,
                    inc_Exp: parseFloat(inc_Exp),
                    date: date
                })
            });
            if (response.ok === true) {
                reset();
                const operation = await response.json();
                var form = document.forms["operationForm"];
                operation.tankType = form.elements["tankId"].options[tankId].text;
                operation.fuelType = form.elements["fuelId"].options[fuelId].text;
                // заменяем операцию в общем списке и перерисовываем текущую страницу
                const index = allOperations.findIndex(o => o.operationID === operation.operationID);
                allOperations[index] = operation;
                showPage(currentPage);
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }

        // сброс формы
        function reset() {
            var form = document.forms["operationForm"];
            form.reset();
            form.elements["operationId"].value = 0;
            document.getElementById("typeCRUD").innerHTML = "Добавить:";
        }

        // Удаление операции
        async function Deleteoperation(id) {
            const response = await fetch("api/operations/" + id, {
                method: "DELETE",
                headers: {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token  // передача токена в заголовке

                }
            });
            if (response.ok === true) {
                const operation = await response.json();
                // удаляем операцию из общего списка и перерисовываем текущую страницу
                // (если на ней не осталось строк, showPage перейдет на предыдущую)
                allOperations = allOperations.filter(o => o.operationID !== operation.operationID);
                showPage(currentPage);
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }

        // нажатие на ссылку Изменить
        async function Edit(id) {
            document.getElementById("typeCRUD").innerHTML = "Изменить:";
            await Getoperation(id);
        }

        // нажатие на ссылку Удалить
        async function Delete(id) {
            await Deleteoperation(id);
            reset();
        }

        // создание строки для таблицы
        function row(operation) {

            const tr = document.createElement("tr");
            tr.setAttribute("data-rowid", operation.operationID);

            const IDTd = document.createElement("td");
            IDTd.append(operation.operationID);
            tr.append(IDTd);

            const fuelTypeTd = document.createElement("td");
            fuelTypeTd.append(operation.fuelType);
            tr.append(fuelTypeTd);

            const tankTypeTd = document.createElement("td");
            tankTypeTd.append(operation.tankType);
            tr.append(tankTypeTd);

            const inc_ExpTd = document.createElement("td");
            inc_ExpTd.append(operation.inc_Exp);
            tr.append(inc_ExpTd);

            const dateTd = document.createElement("td");
            dateTd.append(operation.date.substring(0, 10));
            tr.append(dateTd);

            const link1Td = document.createElement("td");
            const editLink = document.createElement("a");
            editLink.setAttribute("class", "editLink");
            editLink.setAttribute("data-id", operation.operationID)
            editLink.append("Изменить");
            editLink.addEventListener("click", async () => await Edit(operation.operationID));
            link1Td.append(editLink);
            tr.appendChild(link1Td);

            const link2Td = document.createElement("td");
            const removeLink = document.createElement("a");
            removeLink.setAttribute("class", "removeLink");
            removeLink.setAttribute("data-id", operation.operationID)
            removeLink.append("Удалить");
            removeLink.addEventListener("click", async () => await Delete(operation.operationID));
            link2Td.append(removeLink);
            tr.appendChild(link2Td);

            return tr;
        }

        // Получение списка видов топлива
        async function GetFuels() {
            // отправляет запрос и получаем ответ
            const response = await fetch('/api/operations/fuels', {
                method: "GET",
                headers: {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token
                }
            });
            // если запрос прошел нормально
            if (response.ok === true) {
                // получаем данные
                const fuels = await response.json();
                // пункты списка создаются как объекты Option: название вставляется в страницу как текст,
                // а не как разметка HTML, поэтому символы < и > в названии не будут восприняты как теги
                const list = document.getElementById("fuelId");
                list.innerHTML = "";
                list.append(new Option("(выбор)", 0, true, true));
                fuels.forEach(function (fuel) {
                    list.append(new Option(fuel.fuelType, fuel.fuelID));
                });
            }
        }

        // Получение списка емкостей
        async function GetTanks() {
            // отправляет запрос и получаем ответ
            const response = await fetch('/api/operations/tanks', {
                method: "GET",
                headers: {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token
                }
            });
            // если запрос прошел нормально
            if (response.ok === true) {
                // получаем данные
                const tanks = await response.json();
                // пункты списка создаются как объекты Option (см. комментарий в функции GetFuels)
                const list = document.getElementById("tankId");
                list.innerHTML = "";
                list.append(new Option("(выбор)", 0, true, true));
                tanks.forEach(function (tank) {
                    list.append(new Option(tank.tankType, tank.tankID));
                });
            }

        }


        // Обработка документа

        // получаем токен из sessionStorage
        var tokenKey = "accessToken";
        const token = sessionStorage.getItem(tokenKey);

        // сброс значений формы
        document.getElementById("reset").addEventListener("click", () => reset());

        // фильтрация
        document.getElementById("filter").addEventListener("click", () => GetFilteredOperations());

        // отправка формы
        document.getElementById("saveBtn").addEventListener("click", async function (e) {
            e.preventDefault();
            var operationID = document.getElementById("operationId").value;
            var form = document.forms["operationForm"];
            var fuelID = form.elements["fuelId"].selectedIndex;
            var tankID = form.elements["tankId"].selectedIndex;
            var inc_Exp = document.getElementById("inc_exp").value;
            var date = document.getElementById("date").value;
            if (operationID == 0)
                Createoperation(fuelID, tankID, inc_Exp, date);
            else
                Editoperation(operationID, fuelID, tankID, inc_Exp, date);
        });

        // загрузка данных для таблицы и ее формирование
        Getoperations();
        // загрузка данных для списка видов топлива и его формирование
        GetFuels();
        // загрузка данных для списка емкостей и его формирование
        GetTanks();



    </script>
</body>

</html>
