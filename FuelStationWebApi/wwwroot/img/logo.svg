<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Топливная база">
  <title>Топливная база</title>
  <!-- фон: скругленный квадрат цвета Bootstrap primary -->
  <rect width="64" height="64" rx="14" fill="#0d6efd"/>
  <!-- топливораздаточная колонка: корпус, окно счетчика и основание -->
  <rect x="14" y="12" width="24" height="40" rx="3" fill="#fff"/>
  <rect x="18" y="17" width="16" height="10" rx="2" fill="#0d6efd"/>
  <rect x="11" y="50" width="30" height="5" rx="2.5" fill="#fff"/>
  <!-- шланг с пистолетом -->
  <path d="M38 22h5a5 5 0 0 1 5 5v12a3 3 0 0 0 6 0V28l-4-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- капля топлива -->
  <path d="M51 45c-2.2 3-3.2 4.6-3.2 6.2a3.2 3.2 0 0 0 6.4 0c0-1.6-1-3.2-3.2-6.2z" fill="#ffc107"/>
</svg>
